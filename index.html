<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בדיחה בלחיצה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sun:    #FFE15A;
      --paper:  #FFFFFF;
      --ink:    #2B1E4A;
      --ink-soft: #4A3D6B;
      --red:    #F23D2F;
      --hint:   #756B92;
      --error-bg: #FFE8EC;
      --error-text: #C0261B;
      --focus-ring: #2E9BFF;
    }

    body {
      font-family: 'Fredoka', system-ui, sans-serif;
      background-color: var(--sun);
      background-image: url('assets/bg-dots.svg');
      background-repeat: repeat;
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bg-doodles {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 32px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* לוגו */
    .logo {
      display: block;
      width: 300px;
      margin: 0 auto;
    }

    /* הסבר */
    .intro {
      font-size: 17px;
      font-weight: 500;
      color: var(--ink-soft);
      text-align: center;
      line-height: 1.5;
    }

    /* תווית */
    .field-label {
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      display: block;
      margin-bottom: 6px;
    }

    /* תיבת טקסט */
    .topic-input {
      width: 100%;
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: 19px;
      font-weight: 500;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 4px 4px 0 var(--ink);
      rotate: -0.6deg;
      outline: none;
      transition: box-shadow 0.1s;
    }
    .topic-input::placeholder { color: var(--hint); }
    .topic-input:focus {
      outline: 4px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* כפתור ראשי */
    .btn-main {
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      background: var(--red);
      border: 3px solid var(--ink);
      border-radius: 999px;
      min-height: 64px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 0 var(--ink);
      rotate: 1deg;
      transition: box-shadow 0.08s, transform 0.08s;
      position: relative;
      top: 0;
    }
    .btn-main:hover:not(:disabled) { filter: brightness(1.05); }
    .btn-main:active,
    .btn-main:disabled {
      box-shadow: 0 2px 0 var(--ink);
      top: 6px;
    }
    .btn-main:disabled { cursor: not-allowed; opacity: 0.85; }

    /* בועה */
    .bubble {
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: 6px 6px 0 var(--ink);
      rotate: -1.2deg;
      min-height: 190px;
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .bubble[data-state="error"] { background: var(--error-bg); }

    /* דמות */
    .mascot {
      width: 118px;
      display: block;
    }
    .bubble[data-state="joke"] .mascot {
      width: 86px;
      position: absolute;
      top: -20px;
      right: -14px;
      rotate: 8deg;
    }

    /* טקסט הבועה */
    .bubble-text {
      font-size: 17px;
      font-weight: 500;
      color: var(--ink-soft);
      text-align: center;
    }
    .bubble[data-state="joke"] .bubble-text {
      font-family: 'Playpen Sans Hebrew', system-ui, sans-serif;
      font-size: 25px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.55;
      text-align: center;
      padding-top: 16px;
    }
    .bubble[data-state="error"] .bubble-text {
      color: var(--error-text);
      font-size: 17px;
    }

    /* כפתור שתף */
    .btn-share {
      display: none;
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      background: #25D366;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 10px 24px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--ink);
      text-decoration: none;
      transition: box-shadow 0.08s, transform 0.08s;
      margin-top: 8px;
    }
    .btn-share:active {
      box-shadow: 0 1px 0 var(--ink);
      transform: translateY(3px);
    }
    .bubble[data-state="joke"] .btn-share { display: inline-block; }

    /* תחתית */
    .footer {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-soft);
      text-align: center;
      margin-top: auto;
      padding-top: 8px;
    }

    /* אנימציות */
    @keyframes idle-bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-5px); }
    }
    @keyframes think-squish {
      0%, 100% { transform: scaleY(1); }
      50%       { transform: scaleY(0.86); }
    }
    @keyframes joke-roll {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(-10deg); }
      50%  { transform: rotate(10deg); }
      75%  { transform: rotate(-6deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes error-wobble {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(-8deg); }
      75%      { transform: rotate(8deg); }
    }

    .bubble[data-state="idle"]  .mascot { animation: idle-bounce 2.4s ease-in-out infinite; }
    .bubble[data-state="think"] .mascot { animation: think-squish 0.5s ease-in-out infinite; }
    .bubble[data-state="joke"]  .mascot { animation: joke-roll 0.5s ease-in-out 4; }
    .bubble[data-state="error"] .mascot { animation: error-wobble 0.4s ease-in-out 2; }

    @media (prefers-reduced-motion: reduce) {
      .mascot { animation: none !important; }
    }
  </style>
</head>
<body>
  <img class="bg-doodles" src="assets/bg-doodles.svg" alt="" aria-hidden="true" />

  <main class="content">
    <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה" />

    <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>

    <div>
      <label class="field-label" for="topic">על מה הבדיחה?</label>
      <input
        id="topic"
        class="topic-input"
        type="text"
        maxlength="100"
        placeholder="למשל: חתולים"
        autocomplete="off"
      />
    </div>

    <button id="btn" class="btn-main" type="button">תנו לי בדיחה!</button>

    <div id="bubble" class="bubble" data-state="idle">
      <img id="mascot" class="mascot" src="assets/mascot-idle.svg" alt="" aria-hidden="true" />
      <div id="bubble-text" class="bubble-text" aria-live="polite">
        לוחצים על הכפתור, והבדיחה מופיעה כאן
      </div>
      <a id="btn-share" class="btn-share" target="_blank" rel="noopener noreferrer">📲 שתפו</a>
    </div>

    <footer class="footer">מיישם AI ואוטומציה · 53500</footer>
  </main>

  <script>
    const btn       = document.getElementById('btn');
    const bubble    = document.getElementById('bubble');
    const mascot    = document.getElementById('mascot');
    const bubbleText = document.getElementById('bubble-text');
    const btnShare  = document.getElementById('btn-share');

    const MASCOTS = {
      idle:  'assets/mascot-idle.svg',
      think: 'assets/mascot-think.svg',
      joke:  'assets/mascot-joke.svg',
      error: 'assets/mascot-error.svg',
    };

    function setState(state, text) {
      bubble.dataset.state = state;
      mascot.src = MASCOTS[state];
      bubbleText.textContent = text;
    }

    btn.addEventListener('click', async () => {
      const topic = document.getElementById('topic').value.trim();

      btn.disabled = true;
      btn.textContent = 'חושב...';
      setState('think', topic ? `מחפש בדיחה על ${topic}...` : 'מחפש בדיחה...');

      try {
        const res = await fetch('/api/joke', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic }),
        });

        const data = await res.json();

        if (data.joke) {
          setState('joke', data.joke);
          btn.textContent = 'עוד בדיחה!';
          btnShare.href = 'https://wa.me/?text=' + encodeURIComponent(data.joke);
        } else {
          setState('error', data.error ?? 'משהו השתבש. נסו שוב.');
          btn.textContent = 'לנסות שוב';
        }
      } catch {
        setState('error', 'לא הצלחנו להגיע לשרת. נסו שוב.');
        btn.textContent = 'לנסות שוב';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
